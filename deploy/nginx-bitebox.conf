server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __APP_ROOT__/app/frontend/dist;
    index index.html;

    access_log /var/log/nginx/bitebox.access.log;
    error_log  /var/log/nginx/bitebox.error.log;

    # Image uploads from the admin panel
    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + Swagger + uploaded images all live behind /api
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed Vite assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback - React Router owns every other path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
